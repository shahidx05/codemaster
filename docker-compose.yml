# =============================================================================
# docker-compose.yml — Full-stack orchestration with horizontal backend scaling
#
# Services:
#   mongo    — MongoDB 7 with data persistence & healthcheck
#   redis    — Redis 7 Alpine with AOF persistence & healthcheck
#   backend  — Node/Express API (3 replicas, no host port — behind proxy)
#   proxy    — nginx reverse proxy, load-balances across backend replicas
#   worker   — BullMQ submission job processor (same image as backend)
#   frontend — React/Vite SPA served by nginx (separate from proxy)
#
# Horizontal scaling:
#   The backend service has NO container_name and NO fixed host port so it can
#   be replicated. Only the 'proxy' service is exposed to the host on :5000.
#
#   To scale backend replicas:
#     docker compose up -d --scale backend=3   (default in this file)
#     docker compose up -d --scale backend=5   (burst)
#
# Usage:
#   docker compose up --build                  # first run / after code changes
#   docker compose up -d --scale backend=3     # run with 3 backend replicas
#   docker compose logs -f proxy               # follow nginx access log
#   docker compose logs -f backend             # follows ALL replica logs
#   docker compose logs -f worker              # follow worker job processing
#   docker compose down -v                     # stop + delete volumes
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MongoDB 7
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0.21
    container_name: codemaster-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"           # expose for Compass / mongosh on the host
    networks:
      - codemaster-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 (Alpine) — AOF + RDB persistence
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4.3-alpine
    container_name: codemaster-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"             # expose for RedisInsight / redis-cli on the host
    networks:
      - codemaster-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend — Node.js / Express API
  #
  # NO container_name — required for docker compose --scale to work.
  # NO host port mapping — replicas share an internal port; only the proxy
  # is exposed to the host. This is intentional:
  #   - Prevents port conflicts when scaling (you can't bind 5000:5000 × 3)
  #   - Forces all traffic through the proxy (single ingress point)
  #   - The proxy (below) exposes :5000 to the host for the load test
  #
  # Build the image once via the 'backend' service; the 'worker' service
  # reuses the resulting codemaster-server:local image tag.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: codemaster-server:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
    expose:
      - "5000"                  # visible to other containers but NOT the host
    networks:
      - codemaster-net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health | grep -q 'ok' || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Docker sends SIGTERM then waits stop_grace_period before SIGKILL.
    # 35 s gives the Node process its full 30 s SHUTDOWN_TIMEOUT_MS to drain.
    stop_grace_period: 35s
    deploy:
      replicas: 3              # default replica count for `docker compose up`

  # ---------------------------------------------------------------------------
  # Proxy — nginx reverse proxy & load balancer
  #
  # This is the ONLY service with a host port binding on :5000.
  # It distributes incoming requests across all backend replicas using Docker's
  # internal DNS (127.0.0.11) with per-request re-resolution (valid=10s).
  #
  # Access the API at:   http://localhost:5000
  # nginx access logs:   docker compose logs -f proxy
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:1.27.5-alpine3.21
    container_name: codemaster-proxy
    restart: unless-stopped
    ports:
      - "5000:80"               # :5000 on host → nginx → backend replicas
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - codemaster-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Worker — BullMQ submission job processor
  #
  # NO container_name — required for docker compose --scale worker=N.
  # Shares the same codemaster-server:local image as backend.
  # No port exposed — purely an internal consumer.
  #
  # Scale horizontally: docker compose up -d --scale worker=3
  # ---------------------------------------------------------------------------
  worker:
    image: codemaster-server:local
    restart: unless-stopped
    command: ["dumb-init", "--", "node", "worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - codemaster-net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    # Docker sends SIGTERM then waits stop_grace_period before SIGKILL.
    # 100 s gives the worker its full WORKER_SHUTDOWN_TIMEOUT_MS (90 s) to drain
    # any in-flight job (Judge0 submissions can take up to ~30 s per test case).
    stop_grace_period: 100s
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Frontend — React + Vite static SPA served by nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: codemaster-frontend:local
    container_name: codemaster-frontend
    restart: unless-stopped
    ports:
      - "8080:80"               # access at http://localhost:8080
    networks:
      - codemaster-net
    depends_on:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

# =============================================================================
# Named volumes — survive `docker compose down` (use -v to also delete them)
# =============================================================================
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Custom bridge network — all services reach each other by service name
# =============================================================================
networks:
  codemaster-net:
    driver: bridge