# =============================================================================
# nginx/nginx.conf — Reverse proxy & load balancer for the CodeMaster backend
#
# This config sits in front of N backend replicas (default 3) and:
#   1. Load-balances API requests across all healthy replicas (round-robin)
#   2. Forces per-request DNS resolution so new/removed replicas are picked up
#      without restarting nginx (Docker's internal DNS: 127.0.0.11)
#   3. Exposes a single /nginx-health endpoint for Docker's HEALTHCHECK
#   4. Does NOT serve the frontend — that's the separate codemaster-frontend container
#
# Key design decisions:
# ─────────────────────────────────────────────────────────────────────────────
# WHY NOT a static upstream block?
#   upstream { server backend:5000; } resolves the backend hostname ONCE at
#   nginx startup. If replicas are added/removed after start, nginx won't see
#   them without a reload. Using the 'resolver' directive with a variable-based
#   proxy_pass forces re-resolution on every request, which is correct for
#   docker-compose scale scenarios.
#
# WHY round-robin (default)?
#   All replicas are identical (stateless JWT auth, shared Redis/Mongo) so
#   round-robin distributes load evenly. Least-connections would be appropriate
#   if request durations varied significantly, but for an API with sub-100ms
#   p50 responses, round-robin is equivalent and simpler to reason about.
#
# Correlation ID forwarding:
#   X-Request-Id is forwarded to backends so the same ID appears in both
#   nginx access logs and backend pino logs — critical for distributed tracing.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_id [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time '
                    'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Timeouts ─────────────────────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;    # Judge0 submissions can take a while via polling

    # ── Docker embedded DNS resolver ──────────────────────────────────────────
    # 127.0.0.11 is Docker's built-in DNS server (always present in Docker networks).
    # valid=10s means nginx re-resolves 'backend' every 10 seconds — so newly
    # started or stopped replicas are detected within 10s without nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # ── Health endpoint ───────────────────────────────────────────────────
        # Allows the Docker HEALTHCHECK to verify nginx itself is alive without
        # hitting the backend. Returns 200 immediately.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── API proxy ─────────────────────────────────────────────────────────
        # All requests are forwarded to the backend replicas.
        # 'backend' resolves via Docker DNS to one of the replica IPs (round-robin
        # at the DNS level). Combined with nginx's own round-robin upstream selection
        # this gives even distribution.
        location / {
            # Variable-based proxy_pass forces per-request DNS resolution.
            # If 'backend' were used directly in proxy_pass it would be cached at startup.
            set $upstream_backend "backend:5000";
            proxy_pass http://$upstream_backend;

            # Standard reverse-proxy headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward or generate a correlation ID — backends include it in every log line
            proxy_set_header X-Request-Id      $request_id;

            # Disable proxy buffering for SSE / streaming if ever needed
            proxy_buffering off;

            # Don't cache error responses
            proxy_cache_bypass $http_pragma;
        }
    }
}
